<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 824">
  <!-- Gako's icon (gako-app/gako, shells/electron/build/icon.svg) cropped to its rounded square:
       the terminal prompt where agents run, and one line per agent in its state's colour. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(-100 -100)">
    <path d="M262,300 L484,512 L262,724" fill="none" stroke="#ffffff" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="600" y="296" width="226" height="96" rx="48" fill="#22c55e"/>
    <rect x="600" y="464" width="160" height="96" rx="48" fill="#fbbf24"/>
    <rect x="600" y="632" width="200" height="96" rx="48" fill="#38bdf8"/>
  </g>
</svg>
