<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gako</title>
  <meta name="description" content="Gako — something new is coming.">
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; } }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { text-align: center; }
    h1 { font-size: clamp(3rem, 12vw, 6rem); font-weight: 700; letter-spacing: -0.04em; }
    p { margin-top: 0.75rem; color: var(--muted); font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    <h1>Gako</h1>
    <p>Something new is coming.</p>
  </main>
</body>
</html>
